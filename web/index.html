<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amex India — Card Servicing Agent</title>
<style>
  :root {
    --ink:#10161d; --muted:#5b6773; --faint:#8a95a1;
    --bg:#eef1f4; --panel:#fff; --rule:#dce2e8; --rule2:#c3ccd6;
    --accent:#00538f; --accent-soft:#e4eef7;
    --node:#fdf8dc; --node-edge:#b3a874;
    --ok:#1c6e48; --ok-bg:#e2f2ea;
    --no:#9c2f2f; --no-bg:#f9e6e5;
    --hold:#8a5a12; --hold-bg:#f8eeda;
    --sans:"Segoe UI",-apple-system,system-ui,Arial,sans-serif;
    --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--sans); background:var(--bg); color:var(--ink); font-size:15px; height:100vh; overflow:hidden; }

  .app { display:grid; grid-template-rows:auto 1fr; height:100vh; }

  header {
    background:var(--accent); color:#fff; padding:.65rem 1.1rem;
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
  }
  header h1 { font-size:1rem; font-weight:600; letter-spacing:-.01em; }
  header .tag { font-family:var(--mono); font-size:.68rem; opacity:.85; letter-spacing:.08em; text-transform:uppercase; }
  header .spacer { margin-left:auto; }
  header select, header button {
    font-family:var(--sans); font-size:.82rem; padding:.3rem .5rem;
    border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
    color:#fff; border-radius:3px; cursor:pointer;
  }
  header select option { color:#000; }
  #engine { font-family:var(--mono); font-size:.68rem; opacity:.8; }

  .cols { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--rule2); overflow:hidden; }
  @media (max-width:900px){ .cols{ grid-template-columns:1fr; } }

  .col { background:var(--panel); display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; }
  .col > h2 {
    font-size:.7rem; font-family:var(--mono); text-transform:uppercase; letter-spacing:.11em;
    color:var(--faint); padding:.6rem 1rem; border-bottom:1px solid var(--rule); background:#f7f9fb;
    display:flex; align-items:center; gap:.6rem;
  }
  .col > h2 .spacer { margin-left:auto; }
  .col > h2 button {
    font-family:var(--mono); font-size:.65rem; letter-spacing:.06em; text-transform:uppercase;
    padding:.2rem .45rem; border:1px solid var(--rule2); background:#fff; border-radius:2px; cursor:pointer; color:var(--ink);
  }
  .col > h2 button:hover { background:var(--accent-soft); }

  /* ---- chat ---- */
  #log { overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.7rem; }
  .msg { max-width:82%; padding:.6rem .8rem; border-radius:10px; line-height:1.5; white-space:pre-wrap; }
  .msg.member { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:3px; }
  .msg.agent  { align-self:flex-start; background:#f1f4f7; border:1px solid var(--rule); border-bottom-left-radius:3px; }
  .msg.sys { align-self:center; font-family:var(--mono); font-size:.72rem; color:var(--faint); background:none; }

  .meta { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.5rem; }
  .chip {
    font-family:var(--mono); font-size:.66rem; padding:.12rem .4rem; border-radius:2px;
    border:1px solid currentColor; white-space:nowrap;
  }
  .c-ok{color:var(--ok);background:var(--ok-bg);} .c-no{color:var(--no);background:var(--no-bg);}
  .c-hold{color:var(--hold);background:var(--hold-bg);} .c-i{color:var(--accent);background:var(--accent-soft);}

  .opts { display:flex; flex-direction:column; gap:.3rem; margin-top:.55rem; }
  .opts button {
    text-align:left; font-family:var(--sans); font-size:.85rem; padding:.4rem .6rem;
    border:1px solid var(--node-edge); background:var(--node); border-radius:4px; cursor:pointer;
  }
  .opts button:hover { filter:brightness(.97); }

  form { display:flex; gap:.5rem; padding:.8rem 1rem; border-top:1px solid var(--rule); background:#f7f9fb; }
  #q { flex:1; font-family:var(--sans); font-size:.95rem; padding:.55rem .7rem; border:1px solid var(--rule2); border-radius:4px; }
  #q:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  form button { font-size:.9rem; font-weight:600; padding:.55rem 1rem; border:0; border-radius:4px; background:var(--accent); color:#fff; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:default; }

  /* ---- audit ---- */
  #audit { overflow-y:auto; padding:.6rem; font-family:var(--mono); font-size:.72rem; }
  .row {
    border:1px solid var(--rule); border-left:3px solid var(--node-edge);
    background:var(--node); padding:.4rem .55rem; margin-bottom:.35rem; border-radius:2px;
  }
  .row .r1 { display:flex; gap:.5rem; align-items:baseline; }
  .row .id { color:var(--accent); font-weight:700; }
  .row .et { text-transform:uppercase; letter-spacing:.07em; font-size:.62rem; color:var(--muted); }
  .row .ac { font-weight:600; }
  .row .ts { margin-left:auto; color:var(--faint); font-size:.62rem; }
  .row .hash { color:var(--faint); font-size:.62rem; margin-top:.2rem; word-break:break-all; }
  .row pre { margin-top:.3rem; font-size:.66rem; color:var(--muted); white-space:pre-wrap; word-break:break-word; max-height:9em; overflow:auto; }
  .verdict { padding:.5rem 1rem; border-top:1px solid var(--rule); font-family:var(--mono); font-size:.72rem; background:#f7f9fb; }
  .verdict.ok { color:var(--ok); background:var(--ok-bg); }
  .verdict.bad { color:var(--no); background:var(--no-bg); }
  .empty { color:var(--faint); padding:1rem; font-family:var(--mono); font-size:.72rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>American Express India</h1>
    <span class="tag">Card Servicing Agent</span>
    <span class="spacer"></span>
    <span id="engine"></span>
    <select id="member" title="Demo persona"></select>
    <button id="reset" type="button">New session</button>
  </header>

  <div class="cols">
    <section class="col">
      <h2>Conversation <span class="spacer"></span><span id="sid"></span></h2>
      <div id="log"></div>
      <form id="f">
        <input id="q" placeholder="Type a request, e.g. can you waive my late fee?" autocomplete="off">
        <button type="submit" id="send">Send</button>
      </form>
    </section>

    <section class="col">
      <h2>Audit trail
        <span class="spacer"></span>
        <button id="verify" type="button">Verify chain</button>
      </h2>
      <div id="audit"><p class="empty">Every decision, action and system call appears here as it is written.</p></div>
      <div class="verdict" id="verdict">Chain not yet verified.</div>
    </section>
  </div>
</div>

<script>
const PERSONAS = [
  ["MEM-PRIYA",  "Priya — clean history"],
  ["MEM-RAHUL",  "Rahul — two prior waivers"],
  ["MEM-ANANYA", "Ananya — 6 months, stale income"],
  ["MEM-VIKRAM", "Vikram — hardship signals"],
  ["MEM-DEEPA",  "Deepa — two cards"],
];

const $ = (s) => document.querySelector(s);
let sid = newSid();
let lastMessage = null;   // resubmitted verbatim when confirming or choosing

function newSid(){ return "s-" + Math.random().toString(36).slice(2,9); }

function init(){
  $("#member").innerHTML = PERSONAS.map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
  $("#sid").textContent = sid;
  fetch("/health").then(r=>r.json()).then(h=>{
    $("#engine").textContent = `${h.engine} · sessions:${h.sessions} · splunk:${h.splunk ? "on" : "off"}`;
  }).catch(()=>{});
  sys("Pick a persona and ask something. Try “can you waive my late fee?”");
}

function sys(t){ add("sys", t); }

function add(cls, text){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("#log").appendChild(d);
  $("#log").scrollTop = $("#log").scrollHeight;
  return d;
}

function chips(el, data){
  const box = document.createElement("div");
  box.className = "meta";
  const push = (cls, txt) => {
    const s = document.createElement("span");
    s.className = "chip " + cls; s.textContent = txt; box.appendChild(s);
  };
  if (data.intent) push("c-i", `${data.intent.label} ${(data.intent.confidence*100).toFixed(0)}%`);
  (data.decision_records || []).forEach(d => {
    const cls = d.outcome === "APPROVE" ? "c-ok"
              : d.outcome === "DECLINE" ? "c-no" : "c-hold";
    push(cls, `${d.outcome} · ${d.reason_code}`);
    if (d.policy_id) push("c-i", `${d.policy_id} ${d.policy_version || ""}`.trim());
    if (d.source_tag) push("c-hold", d.source_tag);
  });
  (data.actions_taken || []).forEach(a => push("c-ok", `${a.tool || a.action} → ${a.reference || "ok"}`));
  if (data.escalate) push("c-no", "ESCALATED TO HUMAN");
  if (data.awaiting_member) push("c-hold", "AWAITING YOU");
  if (box.children.length) el.appendChild(box);
}

/* The graph is stateless per turn: to confirm or to choose an option, the
   client resubmits the SAME message with the extra flag set. */
function offerChoices(el, reply){
  const lines = reply.split("\n").map(s=>s.trim())
                     .filter(s=>/^\d+[\.\)]/.test(s));
  const box = document.createElement("div");
  box.className = "opts";
  if (lines.length >= 2){
    lines.forEach((line,i)=>{
      const b = document.createElement("button");
      b.textContent = line;
      b.onclick = ()=>{ box.remove(); send(lastMessage, {selected_option:i+1}, `Option ${i+1}`); };
      box.appendChild(b);
    });
  } else {
    [["Confirm",{confirm:true}],["Cancel",null]].forEach(([label,extra])=>{
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = ()=>{ box.remove();
        if (extra) send(lastMessage, extra, "Confirm"); else sys("Cancelled. Nothing was executed."); };
      box.appendChild(b);
    });
  }
  el.appendChild(box);
}

async function send(message, extra, echo){
  if (!message) return;
  add("member", echo || message);
  $("#send").disabled = true; $("#q").value = "";
  lastMessage = message;
  try {
    const r = await fetch("/agent/message", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        session_id: sid, member_id: $("#member").value, message,
        confirm:false, reauthenticated:false, selected_option:null, ...(extra||{})
      })
    });
    const data = await r.json();
    if (!r.ok){ sys("Error: " + (data.detail || r.status)); return; }
    const el = add("agent", data.reply || "(no reply)");
    chips(el, data);
    if (data.awaiting_member) offerChoices(el, data.reply || "");
    if (data.escalation_packet) sys("Handoff packet built: " + (data.escalation_packet.reason || ""));
    loadAudit();
  } catch (e){
    sys("Network error: " + e.message);
  } finally {
    $("#send").disabled = false; $("#q").focus();
  }
}

async function loadAudit(){
  const r = await fetch("/audit/" + sid);
  const { records } = await r.json();
  const box = $("#audit");
  if (!records.length){ box.innerHTML = '<p class="empty">No records yet.</p>'; return; }
  box.innerHTML = records.map(rec => {
    const body = rec.decision
      ? JSON.stringify(rec.decision, null, 1)
      : JSON.stringify(rec.inputs, null, 1);
    return `<div class="row">
      <div class="r1">
        <span class="id">#${rec.record_id}</span>
        <span class="et">${rec.event_type}</span>
        <span class="ac">${esc(rec.action)}</span>
        <span class="ts">${(rec.occurred_at||"").slice(11,19)}</span>
      </div>
      <div class="hash">prev ${(rec.prev_hash||"").slice(0,10)} → ${(rec.record_hash||"").slice(0,10)}</div>
      <pre>${esc(body)}</pre>
    </div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

$("#f").onsubmit = e => { e.preventDefault(); send($("#q").value.trim()); };
$("#verify").onclick = async () => {
  const v = await (await fetch("/audit/verify")).json();
  const el = $("#verdict");
  if (v.status === "OK"){
    el.className = "verdict ok";
    el.textContent = `Chain OK — ${v.records} records, head ${(v.chain_head||"").slice(0,16)}…`;
  } else {
    el.className = "verdict bad";
    el.textContent = `TAMPERED at record ${v.broken_at_record_id} — ${v.reason || ""}`;
  }
};
$("#reset").onclick = () => {
  sid = newSid(); $("#sid").textContent = sid;
  $("#log").innerHTML = ""; $("#audit").innerHTML = '<p class="empty">No records yet.</p>';
  $("#verdict").className = "verdict"; $("#verdict").textContent = "Chain not yet verified.";
  sys("New session " + sid);
};
init();
</script>
</body>
</html>
