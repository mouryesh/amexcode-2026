# credit.limit_increase.v1 — credit line increase (CLI) eligibility.
#
# Mirrors POLICIES.md §4 (POL-CLI-001..007). Read by agent/policy_engine.py:
# rules evaluate top-to-bottom, FIRST full match wins, else `default`.
#
# Outcome mapping: approve->APPROVE, deny->DECLINE, escalate->ESCALATE,
# needs_input->QUEUE.  Source tags: amex_firsthand | industry_standard | regulatory
#
# Persona-preserving rules (existing facts) come first so Ananya still QUEUEs.
# Rules tagged `requires_fact:` fire once that fact is added to
# get_account_facts() + seed.

policy_id: credit.limit_increase
version: v1
description: Assess an unsecured credit limit increase request on account facts.

default:
  outcome: QUEUE
  reason_code: UNDERWRITING_REVIEW
  reason_text: >-
    We've opened an underwriting case to review your request. You'll hear back
    once the review is complete.

rules:
  - id: hardship_detected
    policy_ref: POL-CLI-002
    tier: 0
    source: amex_firsthand
    when:
      - { field: distress_signals, op: eq, value: true }
    outcome: ESCALATE
    reason_code: HARDSHIP_SIGNAL
    reason_text: >-
      It sounds like you may be under financial strain. Increasing your limit
      may not be the right step, so we're connecting you with a specialist.
    rationale: Never raise exposure on an account showing distress.

  - id: stale_income
    policy_ref: POL-CLI-004
    tier: 1
    source: amex_firsthand
    source_ref: "Amex may request updated income before evaluating a CLI"
    when:
      - { field: income_staleness_months, op: gt, value: 12 }
    outcome: QUEUE
    reason_code: INCOME_DATA_STALE
    reason_text: >-
      To review a limit increase we need up-to-date income information. We've
      opened an underwriting case and started a soft check — this won't affect
      your credit score.
    rationale: Responsible lending requires current income (needs_input -> QUEUE).

  - id: thin_file
    policy_ref: POL-CLI-001
    tier: 1
    source: amex_firsthand
    source_ref: "CLI considered only on accounts open >= 60 days; <12mo is thin"
    when:
      - { field: tenure_months, op: lt, value: 12 }
    outcome: QUEUE
    reason_code: THIN_FILE
    reason_text: >-
      Because your account is relatively new, we'll review this request through
      underwriting rather than deciding it automatically.
    rationale: Short history is insufficient signal to auto-approve exposure.

  - id: high_utilisation
    policy_ref: POL-CLI-002
    tier: 2
    source: industry_standard
    when:
      - { field: utilisation, op: gte, value: 0.9 }
    outcome: DECLINE
    reason_code: HIGH_UTILISATION
    reason_text: >-
      Your current balance is close to your existing limit. We're unable to
      increase it right now. Reducing your balance first will help a future request.
    rationale: Very high utilisation signals repayment risk.

  - id: qualified_increase
    policy_ref: POL-CLI-006
    tier: 2
    source: industry_standard
    when:
      - { field: tenure_months, op: gte, value: 12 }
      - { field: income_staleness_months, op: lte, value: 12 }
      - { field: utilisation, op: lt, value: 0.6 }
      - { field: late_payments_12m, op: eq, value: 0 }
    outcome: APPROVE
    reason_code: LIMIT_INCREASE_GRANTED
    reason_text: >-
      Good news — based on your account history we've approved a credit limit increase.
    rationale: Seasoned, current, low-utilisation, on-time members qualify.

# planned_rules: doc rules that need a new fact. NOT evaluated by the engine
# (it reads only `rules:` above). Move an entry up into `rules:` once
# get_account_facts() + seed supply the field named in `requires_fact:`.
planned_rules:
  - id: minimum_account_age
    policy_ref: POL-CLI-001
    tier: 1
    source: amex_firsthand
    source_ref: "Amex CLI: account must be open >= 60 days (hard gate)"
    requires_fact: account_age_days
    when:
      - { field: account_age_days, op: lt, value: 60 }
    outcome: DECLINE
    reason_code: MIN_ACCOUNT_AGE_NOT_MET
    reason_text: >-
      A limit increase can be considered once your account has been open at
      least 60 days. We'll let you know the earliest eligible date.
    rationale: Hard tenure gate; fail closed.

  - id: non_primary_requestor
    policy_ref: POL-CLI-003
    tier: 1
    source: industry_standard
    requires_fact: is_primary_holder
    when:
      - { field: is_primary_holder, op: eq, value: false }
    outcome: DECLINE
    reason_code: NON_PRIMARY_REQUESTOR
    reason_text: >-
      Only the primary account holder can request a credit limit increase.
    rationale: Additional/authorized members are not eligible; fail closed.

  - id: request_too_soon
    policy_ref: POL-CLI-005
    tier: 1
    source: industry_standard
    source_ref: "default 6-month spacing between CLI requests"
    requires_fact: months_since_last_cli
    when:
      - { field: months_since_last_cli, op: lt, value: 6 }
    outcome: DECLINE
    reason_code: REQUEST_FREQUENCY
    reason_text: >-
      A recent limit-increase request is already on file. Please try again after
      the 6-month spacing window; we'll share the next eligible date.
    rationale: Rate-limits repeated CLI requests.

  - id: increase_above_band
    policy_ref: POL-CLI-006
    tier: 2
    source: industry_standard
    source_ref: "auto-approve only <= 25% increase and <= absolute ceiling"
    requires_fact: requested_increase_pct
    when:
      - { field: requested_increase_pct, op: gt, value: 25 }
    outcome: ESCALATE
    reason_code: INCREASE_ABOVE_BAND
    reason_text: >-
      The increase you've asked for is larger than we approve automatically, so
      it goes to underwriting for a closer look.
    rationale: Large increases need income re-verification / underwriting.
