# specs/amex_in_catalog.yaml
#
# The routing projection of the three reference specs, in the one shape the
# runtime needs: every operation, the domain that owns it, the state profile
# that scopes its reads, the flow that services it, and whether it may execute.
#
# Extracted from:
#   01_AMEX_INDIA_INTENT_CATALOG.yaml   domains, operations, acts, modifiers
#   02_AMEX_INDIA_STATE_SCHEMAS.yaml    ST-* profiles, lifecycle enums
#   03_AMEX_INDIA_POLICY_ACTIONS.yaml   FL-* flows, templates, priority order
#
# Loaded by agent/catalogue.py. This file is DATA — adding an operation here
# makes it routable without touching a line of Python.
#
# read_only decides the fail-closed branch (POL-GLOBAL-011): a read-only
# operation with no policy may be answered from an approved source; a
# consequential one must not execute, and builds a T-UNMAPPED handoff.

spec:
  id: AMEX-IN-CATALOG-1.0
  market: IN
  locale: en-IN
  domains: 27
  operations: 380

# Tier 1 is serviced before anything else on a multi-intent turn. Domains
# without a tier fall to 'all_other_service_intents'.
priority_order:
  - {tier: 1, name: emergency_security}
  - {tier: 2, name: fraud_security}
  - {tier: 3, name: card_lifecycle.lost_or_stolen}
  - {tier: 4, name: hardship_collections}
  - {tier: 5, name: bereavement_legal}
  - {tier: 6, name: complaints_grievances}
  - {tier: 7, name: all_other_service_intents}
  - {tier: 8, name: conversational_meta}

