# Terminal flow states — a flow in one of these is closed and cannot resume.
terminal_flow_status: [completed, declined, cancelled, handed_off, expired, failed_safe]

# Deterministic pre-classification gate. These route BEFORE the intent
# classifier runs, so the highest-priority operations can never be swallowed
# by a lower-priority label (03_*.yaml ordered_transition_engine order 2).
emergency_modifiers:
  under_duress_or_coercion:
    domain: emergency_security
    operation: under_duress_or_coercion
    phrases: [being forced, forcing me, someone is making me, held against,
      under duress, threatening me, they are watching, gun to my head,
      digital arrest, not safe to talk]
  active_scam_or_digital_arrest:
    domain: emergency_security
    operation: active_scam_or_digital_arrest
    phrases: [digital arrest, scam call, scammer, fake police, cbi called,
      customs called, they said my account is involved]
  notify_cardmember_death:
    domain: bereavement_legal
    operation: notify_cardmember_death
    phrases: [passed away, has died, deceased, my late father, my late mother,
      my late husband, my late wife, bereavement, funeral]
  card_stolen_with_possible_fraud:
    domain: fraud_security
    operation: card_stolen_with_possible_fraud
    phrases: [card was stolen, someone stole my card, stolen card]
  unrecognized_transaction:
    domain: fraud_security
    operation: unrecognized_transaction
    phrases: [i never made, didn't make this, did not make this, never authorised,
      never authorized, purchase i never, charge i never, don't recognise this charge,
      dont recognize this charge, unauthorised transaction, unauthorized transaction]
  account_takeover:
    domain: fraud_security
    operation: account_takeover
    phrases: [someone has access to my account, locked out of my account,
      my details were changed, account takeover]
  cannot_pay:
    domain: hardship_collections
    operation: cannot_pay
    phrases: [can't pay, cannot pay, lost my job, job loss, laid off, struggling,
      hardship, financial difficulty, unemployed, can't afford, cannot afford,
      behind on, medical bills, no income]
