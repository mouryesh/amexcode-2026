      - {name: help, read_only: true }
      - {name: repeat_or_rephrase, read_only: true }
      - {name: request_human, read_only: false}
      - {name: give_feedback, read_only: false}
      - {name: complain_about_bot, read_only: false}
      - {name: change_language, read_only: false}
